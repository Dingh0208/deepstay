name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: |
          pnpm type
          pnpm lint
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node --input-type=module -e 'import fs from "node:fs"; if (process.env.GITHUB_REF_NAME !== `v${JSON.parse(fs.readFileSync("package.json")).version}`) process.exit(1)'
          fi
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEEPSTAY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deepstay-release.jks"
      - name: Build signed APK
        env:
          DEEPSTAY_KEYSTORE_FILE: ${{ runner.temp }}/deepstay-release.jks
          DEEPSTAY_STORE_PASSWORD: ${{ secrets.DEEPSTAY_STORE_PASSWORD }}
          DEEPSTAY_KEY_PASSWORD: ${{ secrets.DEEPSTAY_KEY_PASSWORD }}
          DEEPSTAY_KEY_ALIAS: ${{ secrets.DEEPSTAY_KEY_ALIAS }}
        run: pnpm android:release
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/deepstay-*.apk
          cd release
          sha256sum deepstay-*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deepstay-android
          path: release/*
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "deepstay $GITHUB_REF_NAME" --generate-notes --latest
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/deepstay-release.jks"
